<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WhatsApp Layout (v1.6)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ==========================================================================
       WHATSAPP SCHEMA IMPLEMENTATION (v1.6) - RESPONSIVE MOBILE UPGRADE
       ========================================================================== */
    html {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #111b21;
      color: #111b21;
    }

    #root {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      background-color: #ffffff;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    }

    #header {
      height: 60px;
      flex-shrink: 0;
      background-color: #008069;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right));
      z-index: 20;
    }

    #content {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      position: relative;
      background-color: #efeae2;
    }

    /* Chat List View */
    #chat-list-view {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background-color: #ffffff;
      border-right: 1px solid #e9edef;
    }

    /* Chat Detail View */
    #chat-detail-view {
      display: flex;
      flex-direction: column;
      height: 100%;
      flex: 1;
      min-width: 0;
      background-color: #efeae2;
      background-image: radial-gradient(#d4cdc3 1px, transparent 1px);
      background-size: 20px 20px;
    }

    #chat-header {
      height: 60px;
      flex-shrink: 0;
      background-color: #f0f2f5;
      border-bottom: 1px solid #d1d7db;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
    }

    @media (min-width: 640px) {
      #chat-header {
        padding: 0 16px;
      }
    }

    #message-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
      scroll-behavior: smooth;
    }

    @media (min-width: 640px) {
      #message-content {
        padding: 16px;
      }
    }

    #message-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #message-input {
      min-height: 60px;
      flex-shrink: 0;
      background-color: #f0f2f5;
      border-top: 1px solid #d1d7db;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
    }

    @media (min-width: 640px) {
      #message-input {
        gap: 10px;
        padding: 8px 14px;
      }
    }

    #footer {
      height: calc(60px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      flex-shrink: 0;
      background-color: #ffffff;
      border-top: 1px solid #e9edef;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 20;
    }

    /* Hide footer on mobile when chat detail is active so keyboard & input have full breathing room */
    @media (max-width: 767px) {
      body.mobile-chat-open #footer {
        display: none;
      }
      body.mobile-chat-open #message-input {
        padding-bottom: max(8px, env(safe-area-inset-bottom));
        min-height: calc(60px + env(safe-area-inset-bottom));
      }
    }

    body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #111b21;
      color: #111b21;
    }

    #root {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 1280px;
      margin: 0 auto;
      background-color: #ffffff;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    }

    #header {
      height: 60px;
      flex-shrink: 0;
      background-color: #008069;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 20;
    }

    #content {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      position: relative;
      background-color: #efeae2;
    }

    /* Chat List View */
    #chat-list-view {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      background-color: #ffffff;
      border-right: 1px solid #e9edef;
    }

    /* Chat Detail View */
    #chat-detail-view {
      display: flex;
      flex-direction: column;
      height: 100%;
      flex: 1;
      min-width: 0;
      background-color: #efeae2;
      background-image: radial-gradient(#d4cdc3 1px, transparent 1px);
      background-size: 20px 20px;
    }

    #chat-header {
      height: 60px;
      flex-shrink: 0;
      background-color: #f0f2f5;
      border-bottom: 1px solid #d1d7db;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    #message-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      scroll-behavior: smooth;
    }

    #message-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #message-input {
      min-height: 60px;
      flex-shrink: 0;
      background-color: #f0f2f5;
      border-top: 1px solid #d1d7db;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
    }

    #footer {
      height: 60px;
      flex-shrink: 0;
      background-color: #ffffff;
      border-top: 1px solid #e9edef;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 20;
    }

    /* Custom subtle scrollbars */
    #chat-list-view::-webkit-scrollbar,
    #message-content::-webkit-scrollbar {
      width: 6px;
    }
    #chat-list-view::-webkit-scrollbar-thumb,
    #message-content::-webkit-scrollbar-thumb {
      background-color: rgba(11, 20, 26, 0.2);
      border-radius: 3px;
    }

    /* Chat bubble tail accents */
    .bubble-in {
      background-color: #ffffff;
      border-radius: 0 12px 12px 12px;
      box-shadow: 0 1px 1px rgba(11, 20, 26, 0.13);
    }
    .bubble-out {
      background-color: #d9fdd3;
      border-radius: 12px 0 12px 12px;
      box-shadow: 0 1px 1px rgba(11, 20, 26, 0.13);
    }

    /* Debug Mode Outlines */
    body.debug-mode #header { outline: 2px solid #f43f5e; outline-offset: -2px; }
    body.debug-mode #content { outline: 2px solid #3b82f6; outline-offset: -2px; }
    body.debug-mode #chat-list-view { outline: 2px dashed #10b981; outline-offset: -2px; }
    body.debug-mode #chat-detail-view { outline: 2px dashed #f59e0b; outline-offset: -2px; }
    body.debug-mode #message-content { outline: 2px solid #8b5cf6; outline-offset: -2px; }
    body.debug-mode #footer { outline: 2px solid #ec4899; outline-offset: -2px; }
  </style>
</head>
<body>
  <!-- #root: Full-height flex column container -->
  <div id="root">
    
    <!-- #header: 60px top app bar -->
    <header id="header">
      <div class="flex items-center gap-2.5">
        <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24" aria-hidden="true">

        </svg>

      </div>

      <div class="flex items-center gap-1.5 sm:gap-2">
        <button 
          id="toggleDebugBtn"
          class="text-xs bg-white/15 hover:bg-white/25 active:bg-white/30 text-white px-2.5 sm:px-3 py-2 rounded-lg transition-colors flex items-center gap-1.5 cursor-pointer min-h-[38px]"
          title="Toggle Schema Bounds"
        >
          <span class="w-2 h-2 rounded-full bg-emerald-300"></span>
          <span class="hidden sm:inline">Schema Bounds</span>
        </button>
        <button id="headerSearchBtn" class="p-2.5 rounded-full hover:bg-white/15 active:bg-white/25 transition-colors cursor-pointer min-w-[40px] min-h-[40px] flex items-center justify-center" aria-label="Search">
          <svg class="w-5 h-5 stroke-current fill-none" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M21 21l-4.35-4.35"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- #content: flex: 1, min-height: 0, overflow: hidden -->
    <main id="content">
      
      <!-- #chat-list-view: Left sidebar on desktop, full screen on mobile when no chat selected -->
      <section id="chat-list-view" class="w-full md:w-[360px] lg:w-[400px] flex-shrink-0">
        <!-- Search bar inside chat list -->
        <div class="p-2.5 border-b border-slate-100 bg-white sticky top-0 z-10">
          <div class="bg-[#f0f2f5] rounded-xl px-3 py-2 flex items-center gap-2">
            <svg class="w-4 h-4 text-slate-500 stroke-current fill-none flex-shrink-0" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M21 21l-4.35-4.35"></path>
            </svg>
            <input 
              id="searchChatsInput"
              type="text" 
              placeholder="Search or start new chat" 
              class="bg-transparent text-base sm:text-sm w-full focus:outline-none text-slate-700 placeholder-slate-500"
            />
          </div>
        </div>

        <!-- Dynamic Chat Items Container -->
        <div id="chat-items-container" class="divide-y divide-slate-100"></div>
      </section>

      <!-- #chat-detail-view: Right panel on desktop, full screen on mobile when chat active -->
      <section id="chat-detail-view" class="hidden md:flex w-full">
        
        <!-- #chat-header: 60px contact header -->
        <div id="chat-header">
          <div class="flex items-center gap-2 sm:gap-3 min-w-0">
            <!-- Mobile Back Button (enlarged touch target >= 44px) -->
            <button id="mobileBackBtn" class="md:hidden p-2.5 -ml-2 rounded-full hover:bg-slate-200/70 active:bg-slate-300/70 text-slate-700 cursor-pointer min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Back to chats">
              <svg class="w-5 h-5 stroke-current fill-none" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
              </svg>
            </button>
            <div id="activeAvatar" class="w-10 h-10 rounded-full bg-emerald-600 text-white font-semibold flex items-center justify-center flex-shrink-0 text-sm">
              AR
            </div>
            <div class="min-w-0">
              <h2 id="activeContactName" class="text-sm font-semibold text-slate-900 truncate">Alya Rahmawati</h2>
              <p id="activeContactStatus" class="text-xs text-slate-500 truncate">online</p>
            </div>
          </div>

          <div class="flex items-center gap-0.5 sm:gap-1 text-slate-600 flex-shrink-0">
            <button id="videoCallBtn" class="p-2.5 rounded-full hover:bg-slate-200/70 active:bg-slate-300/70 transition-colors cursor-pointer min-w-[42px] min-h-[42px] flex items-center justify-center" title="Video call">
              <svg class="w-5 h-5 stroke-current fill-none" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
            </button>
            <button id="voiceCallBtn" class="p-2.5 rounded-full hover:bg-slate-200/70 active:bg-slate-300/70 transition-colors cursor-pointer min-w-[42px] min-h-[42px] flex items-center justify-center" title="Voice call">
              <svg class="w-5 h-5 stroke-current fill-none" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />

        <!-- #message-input: min-height: 60px -->

            <svg class="w-6 h-6 stroke-current fill-none" stroke-width="1.8" viewBox="0 0 24 24">

              <path stroke-linecap="round" d="M8.5 14.5c.8 1.3 2.1 2 3.5 2s2.7-.7 3.5-2"></path>
              <circle cx="9" cy="10" r="1" fill="currentColor"></circle>
              <circle cx="15" cy="10" r="1" fill="currentColor"></circle>
            </svg>
          </button>

          <button type="button" id="attachmentBtn" class="attachment p-2 rounded-full text-slate-600 hover:bg-slate-200/70 active:bg-slate-300/70 transition-colors cursor-pointer min-w-[40px] min-h-[40px] flex items-center justify-center flex-shrink-0" title="Attach file">
            <svg class="w-6 h-6 stroke-current fill-none" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
            </svg>
          </button>

          <input 
            id="textInput"
            type="text" 
            placeholder="Type a message" 
            class="text-input flex-1 min-w-0 bg-white rounded-full px-4 py-2.5 text-base sm:text-sm text-slate-800 placeholder-slate-500 focus:outline-none shadow-xs"
          />

          <button 
            type="submit" 
            id="sendBtn"
            class="send-button w-11 h-11 rounded-full bg-[#008069] hover:bg-[#006d59] active:scale-95 text-white flex items-center justify-center transition-all shadow-sm flex-shrink-0 cursor-pointer"
            title="Send message"
          >
            <svg class="w-5 h-5 fill-current translate-x-0.5" viewBox="0 0 24 24">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </form>

      </section>

    </main>

    <!-- #footer: 60px bottom navigation bar -->
    <footer id="footer">
      <button data-nav="Chats" class="nav-tab flex-1 flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[#008069] font-semibold cursor-pointer min-h-[48px]">
        <div class="relative bg-[#d9fdd3] px-4 py-0.5 rounded-full">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
          </svg>
          <span id="totalUnreadBadge" class="absolute -top-1 -right-1 bg-[#25d366] text-white text-[10px] font-bold px-1.5 rounded-full">4</span>
        </div>
        <span class="text-[11px]">Chats</span>
      </button>

      <button data-nav="Updates" class="nav-tab flex-1 flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-slate-600 hover:text-slate-900 cursor-pointer min-h-[48px]">

          <svg class="w-5 h-5 stroke-current fill-none" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke-dasharray="14 4"></circle>

          <svg class="w-5 h-5 stroke-current fill-none" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>

        <div class="px-4 py-0.5 rounded-full">
          <svg class="w-5 h-5 stroke-current fill-none" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
          </svg>
        </div>
        <span class="text-[11px]">Calls</span>
      </button>
    </footer>

  </div>

  <!-- Subtle Toast Notification (replaces alert) -->
  <div id="toastBanner" class="fixed top-[72px] left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 z-50">
    Notification

          unread: 0,
          messages: [
            { text: "Reminder: Saturday's UI architecture workshop starts at 10:00 WITA.", time: "Yesterday", out: false }
          ]
        },
        {
          id: 6,
          name: "Rizky Hidayat",
          initials: "RH",
          color: "bg-sky-600",
          status: "last seen yesterday at 8:30 PM",
          timestamp: "Tuesday",
          unread: 0,
          messages: [
            { text: "Sent you the updated Figma tokens.", time: "Tuesday", out: false },
            { text: "Got them, thanks!", time: "Tuesday", out: true, status: "read" }
          ]
        },
        {
          id: 7,
          name: "Siti Nurhaliza",
          initials: "SN",
          color: "bg-purple-600",
          status: "online",
          timestamp: "Monday",
          unread: 0,
          messages: [
            { text: "See you at the product sync!", time: "Monday", out: true, status: "read" }
          ]
        }
      ];

      let activeChatId = 1;
      let searchQuery = "";

      const chatItemsContainer = document.getElementById("chat-items-container");
      const chatListView = document.getElementById("chat-list-view");
      const chatDetailView = document.getElementById("chat-detail-view");
      const messageList = document.getElementById("message-list");
      const messageContent = document.getElementById("message-content");
      const activeAvatar = document.getElementById("activeAvatar");
      const activeContactName = document.getElementById("activeContactName");
      const activeContactStatus = document.getElementById("activeContactStatus");
      const textInput = document.getElementById("textInput");
      const messageForm = document.getElementById("message-input");
      const searchChatsInput = document.getElementById("searchChatsInput");
      const mobileBackBtn = document.getElementById("mobileBackBtn");
      const toggleDebugBtn = document.getElementById("toggleDebugBtn");
      const totalUnreadBadge = document.getElementById("totalUnreadBadge");
      const toastBanner = document.getElementById("toastBanner");

      function showToast(msg) {
        toastBanner.textContent = msg;
        toastBanner.classList.remove("opacity-0");
        clearTimeout(toastBanner._timer);
        toastBanner._timer = setTimeout(() => {
          toastBanner.classList.add("opacity-0");
        }, 2000);
      }

      function updateTotalUnread() {
        const total = chats.reduce((sum, c) => sum + c.unread, 0);
        if (total > 0) {
          totalUnreadBadge.textContent = total;
          totalUnreadBadge.classList.remove("hidden");
        } else {
          totalUnreadBadge.classList.add("hidden");
        }
      }

      function renderChatList() {
        const filtered = chats.filter(c =>
          c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          c.messages.some(m => m.text.toLowerCase().includes(searchQuery.toLowerCase()))
        );

        chatItemsContainer.innerHTML = filtered.map(chat => {
          const lastMsg = chat.messages[chat.messages.length - 1];
          const isActive = chat.id === activeChatId;
          return `
            <div 
              data-chat-id="${chat.id}"
              class="chat-item flex items-center gap-3 px-4 py-3.5 cursor-pointer transition-colors active:bg-[#e9edef] ${isActive ? 'md:bg-[#f0f2f5]' : 'hover:bg-[#f5f6f6]'}"
            >
              <!-- avatar -->
              <div class="avatar w-12 h-12 rounded-full ${chat.color} text-white font-semibold flex items-center justify-center flex-shrink-0 text-sm">
                ${chat.initials}
              </div>

              <!-- contact-name & last-message -->
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2">
                  <span class="contact-name font-semibold text-[15px] sm:text-sm text-slate-900 truncate">${chat.name}</span>
                  <span class="timestamp text-[11px] flex-shrink-0 ${chat.unread > 0 ? 'text-[#25d366] font-semibold' : 'text-slate-500'}">
                    ${chat.timestamp}
                  </span>
                </div>
                <div class="flex items-center justify-between gap-2 mt-0.5">
                  <p class="last-message text-xs text-slate-500 truncate">
                    ${lastMsg ? (lastMsg.out ? '✓✓ ' : '') + lastMsg.text : ''}
                  </p>
                  ${chat.unread > 0 ? `
                    <span class="unread-count bg-[#25d366] text-white text-[11px] font-bold min-w-[20px] h-5 px-1.5 rounded-full flex items-center justify-center flex-shrink-0">
                      ${chat.unread}
                    </span>
                  ` : ''}
                </div>
              </div>
            </div>
          `;
        }).join("");

        // Attach click listeners to chat items
        chatItemsContainer.querySelectorAll(".chat-item").forEach(item => {
          item.addEventListener("click", () => {
            const id = Number(item.getAttribute("data-chat-id"));
            selectChat(id, true);
          });
        });
      }

      function renderMessages() {
        const chat = chats.find(c => c.id === activeChatId);
        if (!chat) return;

        activeAvatar.textContent = chat.initials;
        activeAvatar.className = `w-10 h-10 rounded-full ${chat.color} text-white font-semibold flex items-center justify-center flex-shrink-0 text-sm`;
        activeContactName.textContent = chat.name;
        activeContactStatus.textContent = chat.status;

        messageList.innerHTML = chat.messages.map(msg => `
          <div class="message-item flex ${msg.out ? 'justify-end' : 'justify-start'}">
            <div class="message-bubble max-w-[85%] sm:max-w-[75%] px-3.5 py-2 ${msg.out ? 'bubble-out' : 'bubble-in'}">
              <p class="text-sm text-slate-800 leading-relaxed break-words">${msg.text}</p>
              <div class="flex items-center justify-end gap-1 mt-1">
                <span class="timestamp text-[10px] text-slate-500">${msg.time}</span>
                ${msg.out ? `
                  <span class="status text-[11px] font-bold ${msg.status === 'read' ? 'text-[#53bdeb]' : 'text-slate-400'}">
                    ✓✓
                  </span>
                ` : ''}
              </div>
            </div>
          </div>
        `).join("");

        // Auto-scroll #message-content to latest message
        messageContent.scrollTop = messageContent.scrollHeight;
      }

      function openMobileChatDetail() {
        if (window.innerWidth < 768) {
          chatListView.classList.add("hidden");
          chatDetailView.classList.remove("hidden");
          chatDetailView.classList.add("flex");
          document.body.classList.add("mobile-chat-open");
          messageContent.scrollTop = messageContent.scrollHeight;
        }
      }

      function closeMobileChatDetail() {
        chatDetailView.classList.add("hidden");
        chatDetailView.classList.remove("flex");
        chatListView.classList.remove("hidden");
        document.body.classList.remove("mobile-chat-open");
      }

      function selectChat(id, openOnMobile = false) {
        activeChatId = id;
        const chat = chats.find(c => c.id === id);
        if (chat) {
          chat.unread = 0;
        }
        updateTotalUnread();
        renderChatList();
        renderMessages();

        if (openOnMobile) {
          openMobileChatDetail();
        }
      }

      // Mobile Back Button
      mobileBackBtn.addEventListener("click", closeMobileChatDetail);

      // Swipe right gesture on mobile chat detail to return to chat list
      let touchStartX = 0;
      let touchStartY = 0;
      chatDetailView.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      chatDetailView.addEventListener("touchend", (e) => {
        if (window.innerWidth >= 768 || e.changedTouches.length !== 1) return;
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = Math.abs(e.changedTouches[0].clientY - touchStartY);
        if (touchStartX < 48 && deltaX > 75 && deltaY < 50) {
          closeMobileChatDetail();
        }
      }, { passive: true });

      // Keep mobile/desktop split views synchronized on screen resize or orientation change
      window.addEventListener("resize", () => {
        if (window.innerWidth >= 768) {
          chatListView.classList.remove("hidden");
          chatDetailView.classList.remove("hidden");
          chatDetailView.classList.add("flex");
          document.body.classList.remove("mobile-chat-open");
        } else if (!document.body.classList.contains("mobile-chat-open")) {
          chatDetailView.classList.add("hidden");
          chatDetailView.classList.remove("flex");
          chatListView.classList.remove("hidden");
        }
      });

      // Keep message scroll anchored when virtual keyboard opens on mobile
      textInput.addEventListener("focus", () => {
        setTimeout(() => {
          messageContent.scrollTop = messageContent.scrollHeight;
        }, 150);
      });

      // Header search button focuses chat search bar (and returns to list on mobile)
      document.getElementById("headerSearchBtn").addEventListener("click", () => {
        if (window.innerWidth < 768 && document.body.classList.contains("mobile-chat-open")) {
          closeMobileChatDetail();
        }
        searchChatsInput.focus();
      });

      // Call buttons feedback
      document.getElementById("videoCallBtn").addEventListener("click", () => {
        showToast(`Starting video call with ${activeContactName.textContent}...`);
      });

      document.getElementById("voiceCallBtn").addEventListener("click", () => {
        showToast(`Starting voice call with ${activeContactName.textContent}...`);
      });

      // Send Message
      messageForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = textInput.value.trim();
        if (!text) return;

        const chat = chats.find(c => c.id === activeChatId);
        if (!chat) return;

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

        chat.messages.push({
          text,
          time: timeStr,
          out: true,
          status: "delivered"
        });
        chat.timestamp = timeStr;

        textInput.value = "";
        renderChatList();
        renderMessages();
      });

      // Search Chats
      searchChatsInput.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        renderChatList();
      });

      // Quick Emoji & Attachment feedback
      document.getElementById("emojiBtn").addEventListener("click", () => {
        textInput.value += " 😊";
        textInput.focus();
      });

      document.getElementById("attachmentBtn").addEventListener("click", () => {
        showToast("Attachment picker ready");
      });

      // Bottom Navigation Tabs
      document.querySelectorAll(".nav-tab").forEach(tab => {
        tab.addEventListener("click", () => {
          const section = tab.getAttribute("data-nav");
          document.querySelectorAll(".nav-tab").forEach(t => {
            t.classList.remove("text-[#008069]", "font-semibold");
            t.classList.add("text-slate-600");
            t.firstElementChild.classList.remove("bg-[#d9fdd3]");
          });
          tab.classList.add("text-[#008069]", "font-semibold");
          tab.classList.remove("text-slate-600");
          tab.firstElementChild.classList.add("bg-[#d9fdd3]");
          showToast(`Switched to ${section}`);
        });
      });

      // Toggle Schema Bounds Outlines
      toggleDebugBtn.addEventListener("click", () => {
        const active = document.body.classList.toggle("debug-mode");
        showToast(active ? "Schema bounds visible" : "Schema bounds hidden");
      });

      // Initial render
      updateTotalUnread();
      renderChatList();
      renderMessages();
    })();
  </script>
</body>
</html>
