<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111b21" />
    <meta name="description" content="WhatsApp PWA — aplikasi pesan berbasis web." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WhatsApp" />
    <base href="/wa/" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./src/css/app.css" />
    <link rel="stylesheet" href="./src/css/sidebar.css" />
    <link rel="stylesheet" href="./src/css/chat.css" />
    <link rel="stylesheet" href="./src/css/overlay.css" />
    <link rel="stylesheet" href="./src/css/responsive.css" />
    <title>WhatsApp</title>
    <script type="module" src="./src/js/app.js"></script>
    <script type="module" src="./src/js/pwa.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="app-shell">
        <div class="app-layout">
          <aside class="sidebar" aria-label="Daftar percakapan">
            <div id="sidebar-root"></div>
          </aside>
          <main class="chat-panel" aria-label="Panel chat">
            <section class="chat-empty-state" id="chat-empty-state">
              <div class="empty-art" aria-hidden="true">◌</div>
              <h1>WhatsApp Web</h1>
              <p>Kirim dan terima pesan dengan nyaman dari komputer Anda.</p>
              <span class="encryption-note">🔒 Pesan pribadi Anda tetap terenkripsi.</span>
            </section>
            <section class="chat-view" id="chat-view" hidden aria-label="Percakapan aktif"></section>
          </main>
        </div>
      </div>
      <div class="app-overlay" id="app-overlay" aria-live="polite">
        <div class="dialog-container" id="dialog-container"></div>
        <div class="drawer-container" id="drawer-container"></div>
        <div class="notification-container" id="notification-container"></div>
      </div>
    </div>
  </body>
</html>
