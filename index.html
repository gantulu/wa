<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111b21" />
    <meta name="description" content="WhatsApp PWA — modular web application." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WhatsApp" />
    <base href="/wa/" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>WhatsApp PWA</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #111b21; color: #e9edef; }
      * { box-sizing: border-box; }
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .content {
        display: grid;
        flex: 1;
        min-height: 0;
        place-items: center;
        overflow-x: hidden;
        overflow-y: auto;
      }
      main { width: min(100%, 560px); padding: 32px; border: 1px solid #2a3942; border-radius: 18px; background: #202c33; }
      h1 { margin: 0 0 12px; font-size: clamp(1.5rem, 5vw, 2rem); }
      p { margin: 0; color: #aebac1; line-height: 1.65; }
      .eyebrow { margin-bottom: 10px; color: #53bdeb; font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    </style>
    <script type="module" src="./src/js/pwa.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="content">
        <main>
          <p class="eyebrow">Project foundation</p>
          <h1>WhatsApp PWA</h1>
          <p>Repository dan build foundation sudah disiapkan. Implementasi PWA dan fitur aplikasi akan dilakukan pada fase berikutnya.</p>
        </main>
      </div>
    </div>
  </body>
</html>
