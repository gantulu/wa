<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111b21" />
    <title>Offline — WhatsApp PWA</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111b21; color: #e9edef; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); padding: 32px; text-align: center; border: 1px solid #2a3942; border-radius: 18px; background: #202c33; }
      h1 { margin: 0 0 12px; font-size: 1.6rem; }
      p { color: #aebac1; line-height: 1.6; }
      a { display: inline-block; margin-top: 12px; padding: 11px 18px; border-radius: 24px; color: #111b21; background: #25d366; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Anda sedang offline</h1>
      <p>Koneksi internet tidak tersedia. Periksa jaringan Anda, lalu coba muat ulang halaman.</p>
      <a href="./">Coba lagi</a>
    </main>
  </body>
</html>
